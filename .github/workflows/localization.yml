permissions:
  contents: write
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  update-localization:
    name: Update Localization
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Check out the repository
      - name: Check out repository
        uses: actions/checkout@v6

      # Step 2: Install dependencies and extract texts
      - name: Install dependencies
        run: npm ci

      - name: Extract texts
        run: npm run extract-en

      # Step 3: Run doloc for translations
      - name: Translate with doloc
        id: doloc
        uses: doloc-io/doloc-action@v1
        with:
          token: ${{ secrets.DOLOC_API_TOKEN }}
          source: src/lang/en.json
          targets: |
            src/lang/fr.json

      - name: Compile FormatJS messages
        run: |
          npm run format-js-compile-en
          npm run format-js-compile-fr

      # Step 4: Check for changes and commit if needed
      - name: Commit translation updates
        if: steps.doloc.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update translations via doloc
          file_pattern: src/lang/en.json src/lang/fr.json src/compiled-lang/en.json src/compiled-lang/fr.json
